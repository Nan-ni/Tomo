<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Revisar solicitud · Tomo</title>
<link rel="icon" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="config.js"></script>
<style>
:root{--bg:#F3EEE4;--surface:#FFFCF6;--surface-2:#EDE6D8;--line:#E2D9C8;--ink:#1E1912;--ink-2:#5B5244;--ink-3:#8C8272;--accent:#1F4D3F;--accent-ink:#FBF8F1;--warn:#A4452B;--warn-soft:#F7E3D8;--ok:#2E7249;--ok-soft:#DDEEDF}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--surface:#1D1A16;--surface-2:#27231D;--line:#383229;--ink:#F1EADE;--ink-2:#BFB4A2;--ink-3:#8D8373;--accent:#8CC5AE;--accent-ink:#0F1E18;--warn:#EB9C78;--warn-soft:#3A241A;--ok:#80CC9D;--ok-soft:#1A2F21}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px 16px;background:var(--bg);color:var(--ink);font:15px/1.55 "Figtree",system-ui,sans-serif}
.card{width:min(460px,100%);min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 2px 6px rgba(60,40,15,.08),0 18px 44px rgba(60,40,15,.14)}
.brand{display:flex;align-items:center;gap:10px;font-family:"Literata",Georgia,serif;font-weight:700;font-size:20px;color:var(--accent);margin-bottom:18px}
.brand img{width:34px;height:34px;border-radius:10px}
h1{font-family:"Literata",Georgia,serif;font-size:23px;margin:0 0 6px}
p{margin:0;color:var(--ink-2)}
.dato{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.dato small{display:block;color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dato b{font-size:16px;word-break:break-word}
.dato i{color:var(--ink-2)}
.mono{font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;white-space:nowrap}
.acc{display:flex;gap:10px;margin-top:20px}
button{font:inherit;font-weight:700;border-radius:12px;padding:12px 16px;cursor:pointer;flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.si{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.no{color:var(--warn)}
button:disabled{opacity:.55;cursor:default}
.estado{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:600}
.estado.ok{background:var(--ok-soft);color:var(--ok)}
.estado.err{background:var(--warn-soft);color:var(--warn)}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="icons/icon-192.png" alt="">Tomo</div>
  <div id="box"><p>Cargando la solicitud…</p></div>
</main>
<script>
(function(){
  const C=window.TOMO_CONFIG||{}, box=document.getElementById("box");
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const token=new URLSearchParams(location.search).get("t")||"";
  const fecha=d=>new Date(d).toLocaleString("es-PE",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
  async function fn(accion){
    const r=await fetch(C.supabaseUrl.replace(/\/$/,"")+"/functions/v1/aprobar",{method:"POST",headers:{"Content-Type":"application/json",apikey:C.supabaseKey},body:JSON.stringify({token,accion})});
    let j={}; try{ j=await r.json(); }catch(e){} if(!r.ok&&!j.solicitud) throw new Error(j.error||"No se pudo conectar."); return j; }
  function pintar(s,msg,tipo){
    const hecho=s.estado!=="pendiente";
    box.innerHTML=`<h1>${hecho?"Solicitud "+esc(s.estado):"¿Aprobar esta cuenta?"}</h1>
      <p>${hecho?"Esta solicitud ya fue resuelta.":"Al aprobarla se crea la cuenta y le llega por correo su ID y su contraseña temporal."}</p>
      <div class="dato"><small>Nombre</small><b>${esc(s.nombre||"—")}</b></div>
      <div class="dato"><small>Correo</small><b>${esc(s.email)}</b></div>
      ${s.mensaje?`<div class="dato"><small>Mensaje</small><i>“${esc(s.mensaje)}”</i></div>`:""}
      <div class="dato"><small>Pedida el</small><b>${esc(fecha(s.creado))}</b></div>
      ${s.codigo?`<div class="dato"><small>Su ID</small><b class="mono">${esc(s.codigo)}</b></div>`:""}
      ${hecho?"":`<div class="acc"><button class="no" id="no">Rechazar</button><button class="si" id="si">Aprobar</button></div>`}
      ${msg?`<div class="estado ${tipo}">${msg}</div>`:""}`;
    if(!hecho){ document.getElementById("si").onclick=()=>actuar("aprobar",s); document.getElementById("no").onclick=()=>actuar("rechazar",s); } }
  async function actuar(accion,s){
    for(const b of box.querySelectorAll("button")) b.disabled=true;
    try{ const j=await fn(accion);
      if(j.error){ pintar(j.solicitud||s,esc(j.error),"err"); return; }
      if(accion==="aprobar") pintar({...s,estado:"aprobada",codigo:j.codigo},j.yaExistia?`Ya tenía una cuenta: ${esc(j.codigo)}.`:`Cuenta creada: <span class="mono">${esc(j.codigo)}</span>. Le enviamos un correo a ${esc(s.email)}.`,"ok");
      else pintar({...s,estado:"rechazada"},"Solicitud rechazada. No se le envió nada.","ok");
    }catch(e){ pintar(s,esc(e.message),"err"); } }
  if(!C.supabaseUrl||/TU-PROYECTO/.test(C.supabaseUrl)){ box.innerHTML="<h1>Falta configurar</h1><p>Completa config.js con los datos de tu proyecto de Supabase.</p>"; return; }
  if(!token){ box.innerHTML="<h1>Enlace incompleto</h1><p>Abre el enlace completo que te llegó por correo.</p>"; return; }
  fn("ver").then(j=>{ if(!j.solicitud) throw new Error(j.error||"Solicitud no encontrada."); pintar(j.solicitud); })
    .catch(e=>{ box.innerHTML=`<h1>No se pudo abrir</h1><p>${esc(e.message)}</p>`; });
})();
</script>
</body>
</html>
